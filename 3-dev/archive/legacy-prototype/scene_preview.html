const RE={woodcutter:'🪓',smith:'🔨',cook:'🍲',fisher:'🎣',idler:'🧑',tavernkeeper:'🍺'};
const TW=64,TH=32,COLS=5,ROWS=4,HOUSE=[[0,0],[2,0],[4,0],[0,2],[3,3]],TAV=[2,2],WALK=[[1,1],[3,1],[1,3],[2,3],[4,2]];
function iX(c,r){return (c-r)*TW/2;} function iY(c,r){return (c+r)*TH/2;}
function hashi(s,m){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%m;}
function sky(h,s,w){let g;if(h<5||h>=22)g=['#0b1020','#141a2e'];else if(h<8)g=['#f6a96b','#3a3a66'];else if(h<18)g=['#7ec0ee','#cfeafe'];else if(h<21)g=['#ff9e6b','#4a3a66'];else g=['#1a2240','#0b1020'];if(s==='зима')g=[g[0],'#b9c6dd'];return `linear-gradient(${g[0]},${g[1]})`;}
function add(p,src,x,y,w,h,z){const im=document.createElement('img');im.className='spr';im.src=src;im.style.cssText=`left:${x}px;top:${y}px;width:${w}px;${h?'height:'+h+'px;':''}z-index:${z}`;p.appendChild(im);}
function tgt(name,hour,inTav){if(hour>=23||hour<7)return HOUSE[hashi(name,HOUSE.length)];if(hour>=18&&hour<23&&inTav)return TAV;return WALK[hashi(name+'w',WALK.length)];}
function scene(H,hour){const sc=document.createElement('div');sc.className='scene';sc.style.background=sky(hour,H.season);
 const orb=document.createElement('div');orb.className='orb';orb.textContent=(hour>=22||hour<6)?'🌙':'☀';sc.appendChild(orb);
 const w3=document.createElement('div');w3.className='world3d';sc.appendChild(w3);
 const winter=(H.cold||H.season==='зима');const tile=winter?SP.tile_snow:SP.tile_grass;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)add(w3,tile,iX(c,r)-TW/2,iY(c,r),TW,TH,c+r);
 let dark=0;if(hour>=21)dark=(hour-21)/3+0.45;else if(hour<7)dark=(7-hour)/4+0.3;dark=Math.max(0,Math.min(0.82,dark));
 const mk=(c,r)=>{const g=document.createElement('div');g.className='win';g.style.left=(iX(c,r)-4)+'px';g.style.top=(iY(c,r)-14)+'px';g.style.opacity=dark>0.2?0.9:0;w3.appendChild(g);};
 HOUSE.slice(0,4).forEach(([c,r])=>{add(w3,SP.house,iX(c,r)-32,iY(c,r)-40,64,72,50+c+r);mk(c,r);});
 add(w3,SP.tavern,iX(2,2)-32,iY(2,2)-40,64,72,54);mk(2,2);
 const ppl=[];(H.roster||[]).forEach(r=>ppl.push({n:r.name,sp:SP.villager,e:RE[r.role]||'🧑'}));ppl.push({n:'Ты',sp:SP.player,e:'⭐'});
 const sleeping=(hour>=23||hour<7);
 ppl.forEach(p=>{const [c,r]=tgt(p.n,hour,true);const jx=hashi(p.n,7)-3,jy=hashi(p.n+'y',5)-2;const x=iX(c,r)+jx,y=iY(c,r)+jy;
  add(w3,p.sp,x-14,y-30,28,40,100+c+r);const np=document.createElement('div');np.className='nameplate';np.style.left=x+'px';np.style.top=(y+2)+'px';np.textContent=(sleeping?'💤 ':p.e+' ')+p.n;w3.appendChild(np);});
 const ni=document.createElement('div');ni.className='night';ni.style.opacity=dark;sc.appendChild(ni);
 return sc;}
const roster=[{name:'Велибор',role:'woodcutter'},{name:'Мирон',role:'smith'},{name:'Ждана',role:'cook'},{name:'Радим',role:'tavernkeeper'}];
const host=document.getElementById('host');
