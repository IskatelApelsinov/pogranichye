<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b21">
<title>Приграничье</title>
<style>
 :root{--bg:#24251f;--card:#39352b;--line:#66533c;--ink:#f1e5c9;--sub:#c2b18e;
   --gold:#e8bd66;--good:#8da96a;--warn:#d99b4e;--bad:#c96b58;--accent:#9b6541}
 *{box-sizing:border-box} html,body{overflow-x:hidden}
 body{background:radial-gradient(ellipse at 50% 0%,#4a4934 0,#24251f 62%);color:var(--ink);font:16px/1.5 Georgia,serif;
   max-width:680px;margin:0 auto;padding:16px}
 h1{font-size:25px;margin:.2em 0;color:#f2d9a7;text-shadow:0 2px #39291e} .sub{color:var(--sub);font-size:13px}
 .card{background:linear-gradient(145deg,#454032,#332f27);border:1px solid var(--line);border-radius:9px;padding:16px;margin:12px 0;box-shadow:0 5px 14px #1117}
 input{width:100%;background:#26251f;color:var(--ink);border:1px solid var(--line);
   border-radius:10px;padding:12px;font:inherit;margin:6px 0;min-height:46px}
 button{background:linear-gradient(#67533b,#493a2b);color:var(--ink);border:1px solid #8b704b;border-radius:7px;
   padding:12px 14px;font:inherit;cursor:pointer;min-height:46px;touch-action:manipulation}
 button.primary{background:linear-gradient(#b77b4e,#865334);border-color:#d3a06a;color:#fff4dc;width:100%}
 button:active{filter:brightness(1.2)} button:disabled{opacity:.45;cursor:default}
 .row{display:flex;gap:8px;flex-wrap:wrap} .between{justify-content:space-between;align-items:center}
 .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
 .locgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
 .loc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;line-height:1.2}
 .loc .ico{font-size:22px} .loc.here{background:linear-gradient(#b77b4e,#865334);border-color:#d3a06a;color:#fff4dc}
 .bar{height:12px;border-radius:3px;background:#211f1a;border:1px solid #5c4a35;overflow:hidden;margin:3px 0 8px}
 .bar>div{height:100%}
 .stat{font-size:13px;color:var(--sub)} .big{font-size:20px;font-weight:700}
 .tag{font-size:12px;padding:2px 9px;border-radius:999px;background:#514431;color:#ead4a7;border:1px solid #786143;display:inline-block;margin:2px 3px 0 0}
 .skill{font-size:12px;padding:2px 8px;border-radius:999px;background:#2d3a24;color:#cfe0b0;border:1px solid #4a6035;display:inline-block;margin:2px 3px 0 0}
 .nb{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
 .nb:last-child{border:0}
 #err{color:var(--bad);font-size:13px;min-height:18px} .hidden{display:none} .gold{color:var(--gold)}
 .mg{background:#2b2922;border:1px solid #5c4a35;border-radius:8px;padding:12px;margin-top:8px}
 .track{position:relative;height:26px;background:#1d1b16;border:1px solid #5c4a35;border-radius:6px;overflow:hidden}
 .zone{position:absolute;top:0;bottom:0;background:#3c5a2e}
 .mark{position:absolute;top:0;bottom:0;width:4px;background:#ffe9a8}
 .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c9924a,#8a5a2b)}
 .toast{color:#ffe1a0;font-size:14px;min-height:20px;margin-top:6px}
</style>
</head>
<body>
<h1>Приграничье <span class="sub">· хозяйство</span></h1>

<!-- вход / регистрация -->
<div class="card" id="auth">
 <div class="row" style="margin-bottom:8px">
  <button id="tabLogin" class="primary" style="width:auto;flex:1">Вход</button>
  <button id="tabReg" style="flex:1">Регистрация</button>
 </div>
 <input id="login" placeholder="логин" autocomplete="username">
 <input id="pass" type="password" placeholder="пароль (от 4 символов)" autocomplete="current-password">
 <button class="primary" id="go">Войти в мир</button>
 <div id="err"></div>
 <div class="sub" style="margin-top:8px">Один аккаунт — любой клиент. Войдя, ты вселяешься в жителя и ведёшь его хозяйство.</div>
</div>

<!-- игра (менеджмент/ферма по тапам) -->
<div class="hidden" id="game">
 <div class="card" id="charcard"></div>

 <div class="card">
  <div class="row between"><b class="sub">Мир</b><span class="sub" id="daytime"></span></div>
  <div class="locgrid" id="locgrid"></div>
 </div>

 <div class="card" id="locscreen">
  <div class="row between"><b id="locname">—</b><span class="sub" id="loccount"></span></div>
  <div class="sub" id="locdesc"></div>
  <div id="locactions" class="acts"></div>
  <div id="minigame"></div>
  <div class="toast" id="toast"></div>
  <div style="margin-top:8px"><b class="sub">кто здесь</b><div id="who"></div></div>
 </div>

 <div class="card hidden" id="dialog" style="border-color:#c9a86a">
  <div><b id="dlgwho">—</b> <span class="sub">говорит:</span></div>
  <div id="dlgline" style="margin:6px 0;color:#ead9b0">…</div>
  <div class="acts" id="dlgopts"></div>
  <button onclick="send({op:'endtalk'})" style="width:auto;margin-top:6px;padding:3px 10px">Отойти</button>
 </div>

 <div class="card" id="invcard"></div>
 <div class="card" id="travelcard"></div>

 <div class="card hidden" id="invite" style="border-color:#d3a06a;background:#4a3f2c">
  <div><b id="invwho">—</b> <span class="sub">зовёт выпить вместе</span></div>
  <div class="acts" style="margin-top:6px">
   <button class="primary" style="width:auto" onclick="send({op:'accept'})">🍻 Принять</button>
   <button style="width:auto" onclick="send({op:'declinedrink'})">Отказаться</button>
  </div>
 </div>

 <button id="leave" style="width:100%;margin-bottom:24px">Выйти (тело вернётся под управление мира)</button>
</div>

<script>
let token=null, ws=null, mode='login';
const $=id=>document.getElementById(id);
$('tabLogin').onclick=()=>{mode='login';$('tabLogin').className='primary';$('tabReg').className='';$('go').textContent='Войти в мир';};
$('tabReg').onclick =()=>{mode='reg';  $('tabReg').className='primary';$('tabLogin').className='';$('go').textContent='Создать и войти';};
async function api(path,body){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 return r.json();
}
$('go').onclick=async()=>{
 $('err').textContent='';
 const login=$('login').value.trim(), pass=$('pass').value;
 if(!login||pass.length<4){$('err').textContent='нужен логин и пароль от 4 символов';return;}
 if(mode==='reg'){ const rr=await api('/api/register',{login,pass});
   if(!rr.ok){$('err').textContent=rr.msg||'не удалось зарегистрироваться';return;} }
 const lr=await api('/api/login',{login,pass});
 if(!lr.ok){$('err').textContent=lr.msg||'неверный вход';return;}
 token=lr.token; connect();
};
async function connect(){
 const proto=location.protocol==='https:'?'wss':'ws';
 ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
 ws.onmessage=e=>render(JSON.parse(e.data));
 ws.onclose=()=>{ if(token){ $('err').textContent='связь прервалась'; } };
 ws.onopen=()=>{ $('auth').classList.add('hidden'); $('game').classList.remove('hidden'); goTo('well'); };
}
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(Object.assign({v:1},o))); }
function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
$('leave').onclick=()=>{ token=null; if(ws)ws.close(); location.reload(); };

// ---------- локации (тап-навигация, без ходьбы) ----------
const LOCS=[
 {key:'well',   name:'Площадь',  ico:'⛲', desc:'Сердце деревни. Можно поговорить с людьми и дать отпор зверю.'},
 {key:'tavern', name:'Корчма',   ico:'🍺', desc:'Кружка пива, знакомства, посиделки.'},
 {key:'river',  name:'Река',     ico:'🎣', desc:'Рыбалка — подсеки в нужный миг.'},
 {key:'woods',  name:'Лес',      ico:'🪓', desc:'Рубка дров — бей в полную силу.'},
 {key:'garden', name:'Поля',     ico:'🥕', desc:'Пахари работают в поле.'},
 {key:'smithy', name:'Кузница',  ico:'⚒', desc:'Кузнец куёт железо.'},
 {key:'granary',name:'Амбар',    ico:'🌾', desc:'Общие запасы зерна и хлеба.'},
 {key:'mine',   name:'Рудник',   ico:'⛏', desc:'Рудокопы добывают руду.'},
];
let curLoc='well', last=null;
function goTo(key){ curLoc=key; stopMinigames(); send({op:'goto',location:key}); if(last) drawLoc(last); toast(''); }
function toast(t){ $('toast').textContent=t; }

function render(s){ last=s; drawChar(s); drawWorld(s); drawLoc(s); drawInv(s); drawTravel(s); drawDialog(s); }

function drawInv(s){
 const me=s.me||{}, inv=me.inv||{items:{},hand:'',worn:{}};
 const names={axe:'топор',sword:'меч',bow:'лук',rod:'удочка',torch:'факел',lantern:'фонарь',cloak:'плащ',boots:'сапоги',hat:'шапка',bread:'хлеб',fish:'рыба',wood:'дерево',meat:'мясо',hide:'шкура',wheat:'зерно',veg:'овощи'};
 const items=Object.entries(inv.items||{}).filter(([k,v])=>v>0);
 const hand=['axe','sword','bow','rod','torch','lantern'];
 let h=`<b class="sub">сума</b> <span class="sub">· в руке: ${names[inv.hand]||'пусто'} · надето: ${Object.values(inv.worn||{}).map(x=>names[x]||x).join(', ')||'ничего'}</span>`;
 h+='<div style="margin-top:6px">'+(items.length?items.map(([k,v])=>`<span class="tag">${names[k]||k} ×${v}</span>`).join(''):'<span class="sub">пусто</span>')+'</div>';
 h+='<div class="acts" style="grid-template-columns:1fr 1fr 1fr">';
 hand.forEach(it=>{ if((inv.items||{})[it]>0 && inv.hand!==it) h+=`<button style="width:auto;padding:4px 8px" onclick="send({op:'equip',item:'${it}'})">взять ${names[it]}</button>`; });
 ['cloak','boots','hat'].forEach(it=>{ if((inv.items||{})[it]>0) h+=`<button style="width:auto;padding:4px 8px" onclick="send({op:'wear',item:'${it}'})">надеть ${names[it]}</button>`; });
 h+='</div>';
 $('invcard').innerHTML=h;
}
function drawTravel(s){
 const world=(s.me&&s.me.world)||[], here=(s.me&&s.me.known_places)||[];
 const visited=new Set(here.filter(p=>p.visited).map(p=>p.id));
 let h='<b class="sub">мир · путешествия</b> <span class="sub">стартовая деревня — центр Мира</span><div class="acts">';
 world.forEach(p=>{ h+=`<button style="width:auto" onclick="send({op:'travel',target:'${p.id}'})">🧭 ${p.name}${visited.has(p.id)?' ✓':''}</button>`; });
 h+='</div>'; $('travelcard').innerHTML=h;
}

function drawChar(s){
 const me=s.me||{}; const bar=(v,c)=>`<div class="bar"><div style="width:${Math.max(0,Math.min(100,v))}%;background:${c}"></div></div>`;
 const skills=Object.entries(me.skills||{}).sort((a,b)=>b[1]-a[1]).slice(0,6)
   .map(([k,v])=>`<span class="skill">${k} · ${Math.round(v)}</span>`).join('')||'<span class="sub">пока без умений</span>';
 $('charcard').innerHTML=
  `<div class="row between"><div><span class="big">${me.name||'—'}</span> <span class="sub">${me.surname||''} ${me.nick?('«'+me.nick+'»'):''}</span></div>
     <span class="tag">${me.role||''}</span></div>
   <div class="sub">${me.trait||''}${me.origin?(' · '+me.origin):''} · ${me.sex==='ж'?'женщина':'мужчина'} · ${Math.round(me.age||0)} лет · 💰 ${me.coins??0} · <span class="gold">${me.desire||''}</span></div>
   <div style="margin-top:8px">
     <span class="stat">здоровье</span>${bar(me.health,'#8da96a')}
     <span class="stat">сытость</span>${bar(me.hunger,'#c9a24a')}
     <span class="stat">силы</span>${bar(me.energy,'#6ab0d9')}
     <span class="stat">настрой</span>${bar(me.morale,'#c58fd0')}
   </div>
   <div style="margin-top:4px">${skills}</div>`;
}
function drawWorld(s){
 $('daytime').textContent=`${s.season||''}, день ${s.day||0}, год ${s.year||0}`;
 const g=$('locgrid');
 if(g.childElementCount!==LOCS.length){ g.replaceChildren(); LOCS.forEach(L=>{
   const b=document.createElement('button'); b.className='loc'; b.dataset.k=L.key;
   b.innerHTML=`<span class="ico">${L.ico}</span><span>${L.name}</span>`;
   b.onclick=()=>goTo(L.key); g.appendChild(b);
 });}
 [...g.children].forEach(b=>b.classList.toggle('here',b.dataset.k===curLoc));
}

function drawLoc(s){
 const L=LOCS.find(x=>x.key===curLoc)||LOCS[0];
 $('locname').textContent=`${L.ico} ${L.name}`; $('locdesc').textContent=L.desc;
 const me=s.me||{};
 // кто здесь: соседи у этой локации (по близости к POI из layout — но нам хватит всех соседей сцены)
 const here=(s.place&&s.place.neighbors)||[];
 $('loccount').textContent=here.length?`${here.length} рядом`:'';
 const who=$('who'); who.replaceChildren();
 if(!here.length){ const d=document.createElement('div'); d.className='sub'; d.textContent='никого рядом'; who.appendChild(d); }
 here.forEach(n=>{
   const row=document.createElement('div'); row.className='nb';
   const nm=n.player?'🧑 игрок':(n.known?(n.name||'житель'):(n.desc||'житель'));
   const lab=document.createElement('span'); lab.innerHTML=`${(n.known||n.player)?'<b>'+nm+'</b>':nm} <span class="sub">— ${n.act||''}${n.trait?(' · '+n.trait):''}</span>`;
   row.appendChild(lab);
   if(!me.talk){
     const b=document.createElement('button'); b.style.cssText='width:auto;padding:4px 10px';
     if(n.player){ b.textContent='🍻 позвать'; b.onclick=()=>send({op:'invite',target:n.id}); }
     else { b.textContent='💬'; b.onclick=()=>send({op:'talk',target:n.id}); }
     row.appendChild(b);
   }
   who.appendChild(row);
 });
 drawLocActions(s,L);
}

// контекстные действия и мини-игры локации
function drawLocActions(s,L){
 const A=$('locactions'), M=$('minigame'); A.replaceChildren(); M.replaceChildren();
 const me=s.me||{};
 if(L.key==='tavern'){
   const beer=(s.place&&s.place.beer)||0, price=(s.place&&s.place.beer_price), mug=!!me.mug;
   const b1=btn(mug?'🍺 кружка в руке':'🍺 Заказать ('+(price??'?')+'⌾)', ()=>send({op:'buy',item:'beer',reqid:rid()}), mug||beer<1||me.coins<price);
   const b2=btn('🍻 Выпить', ()=>send({op:'consume',item:'beer',reqid:rid()}), !mug);
   A.append(b1,b2);
   M.innerHTML=`<div class="sub">пива в корчме: ${beer}</div>`;
 } else if(L.key==='river'){
   A.append(btn('🎣 Взять удочку',()=>send({op:'take',item:'rod',reqid:rid()})));
   fishingGame(M);
 } else if(L.key==='woods'){
   A.append(btn('🪓 Взять топор',()=>send({op:'take',item:'axe',reqid:rid()})));
   A.append(btn('🏹 Охота',()=>act2('hunt','Охочусь…')));
   A.append(btn('⚔ Стычка',()=>act2('fight','Отгоняю зверя…')));
   choppingGame(M);
 } else if(L.key==='smithy'){
   A.append(btn('⚔ Взять меч',()=>send({op:'take',item:'sword',reqid:rid()})));
   A.append(btn('🏹 Взять лук',()=>send({op:'take',item:'bow',reqid:rid()})));
   A.append(btn('🔨 Помочь строить',()=>act2('build','Строю…')));
 } else if(L.key==='granary'){
   ['cloak','boots','hat','torch','lantern'].forEach(it=>A.append(btn('взять '+({cloak:'плащ',boots:'сапоги',hat:'шапка',torch:'факел',lantern:'фонарь'})[it],()=>send({op:'take',item:it,reqid:rid()}))));
   marketUI(M,s);
 } else if(L.key==='garden'){
   A.append(btn('🔨 Помочь строить',()=>act2('build','Строю…')));
   marketUI(M,s);
 } else if(L.key==='well'){
   A.append(btn('✨ Разряд (защита) · мана '+(me.mana??0), ()=>send({op:'act',action:'cast',reqid:rid()}), (me.mana||0)<25));
 } else {
   M.innerHTML='<div class="sub">Здесь трудятся жители. Поговори с ними.</div>';
 }
}
function btn(text,fn,dis){ const b=document.createElement('button'); b.textContent=text; b.onclick=fn; b.disabled=!!dis; return b; }
function act2(a,msg){ send({op:'act',action:a,reqid:rid()}); toast(msg); }
// рынок: купить/продать ходовые товары
function marketUI(M,s){
 M.className='mg'; const names={bread:'хлеб',wheat:'зерно',fish:'рыба',wood:'дерево',veg:'овощи',meat:'мясо'};
 let h='<b class="sub">рынок</b><div class="acts" style="grid-template-columns:1fr 1fr">';
 ['bread','wheat','fish','wood'].forEach(g=>{
   h+=`<button style="width:auto;padding:4px 8px" onclick="send({op:'trade',good:'${g}',side:'buy',qty:1})">купить ${names[g]}</button>`;
   h+=`<button style="width:auto;padding:4px 8px" onclick="send({op:'trade',good:'${g}',side:'sell',qty:1})">продать ${names[g]}</button>`;
 });
 h+='</div>'; M.innerHTML=h;
}

// ---------- мини-игра РЫБАЛКА: подсечь, когда поплавок в зоне ----------
let mgRAF=0;
function stopMinigames(){ if(mgRAF){ cancelAnimationFrame(mgRAF); mgRAF=0; } }
function fishingGame(M){
 M.className='mg'; M.innerHTML=`<b class="sub">Рыбалка</b>
   <div class="track" id="ftrack"><div class="zone" id="fzone"></div><div class="mark" id="fmark"></div></div>
   <div class="acts"><button class="primary" style="width:auto" id="fcast">🎣 Подсечь</button></div>`;
 const zone=$('fzone'), mark=$('fmark');
 const zx=20+Math.random()*55, zw=18; zone.style.left=zx+'%'; zone.style.width=zw+'%';
 let t=0;
 const loop=()=>{ t+=0.03; const p=(Math.sin(t)*0.5+0.5)*100; mark.style.left=p+'%'; mark.dataset.p=p; mgRAF=requestAnimationFrame(loop); };
 loop();
 $('fcast').onclick=()=>{ const p=parseFloat(mark.dataset.p||'0');
   if(p>=zx&&p<=zx+zw){ send({op:'act',action:'fish',reqid:rid()}); toast('🐟 Подсёк! рыбина в закромах'); }
   else toast('…сорвалось, лови момент'); };
}
// ---------- мини-игра РУБКА: останови шкалу силы на максимуме ----------
function choppingGame(M){
 M.className='mg'; M.innerHTML=`<b class="sub">Рубка дров</b>
   <div class="track" id="ctrack"><div class="fill" id="cfill" style="width:0%"></div></div>
   <div class="acts"><button class="primary" style="width:auto" id="cchop">🪓 Бить</button></div>`;
 const fill=$('cfill'); let t=0;
 const loop=()=>{ t+=0.045; const p=(Math.sin(t)*0.5+0.5)*100; fill.style.width=p+'%'; fill.dataset.p=p; mgRAF=requestAnimationFrame(loop); };
 loop();
 $('cchop').onclick=()=>{ const p=parseFloat(fill.dataset.p||'0');
   if(p>=70){ send({op:'act',action:'chop',reqid:rid()}); toast(p>=92?'🪵 Мощный удар! бревно':'🪵 Срубил, бревно в закромах'); }
   else toast('…слабо, бей в полную силу'); };
}

// ---------- разговор / приглашение / тост ----------
let lastSocial=0;
function drawDialog(s){
 const me=s.me||{}, talk=me.talk;
 if(talk){ $('dialog').classList.remove('hidden');
   $('dlgwho').textContent=talk.who+(talk.known?'':' · незнакомец'); $('dlgline').textContent=talk.line||'…';
   const o=$('dlgopts'); o.replaceChildren();
   (talk.options||[]).forEach(op=>{ const b=document.createElement('button'); b.textContent=op.text; b.style.cssText='width:auto';
     b.onclick=()=>send({op:'say',line:op.id}); o.appendChild(b); });
 } else $('dialog').classList.add('hidden');
 const inv=me.invite_from;
 if(inv){ $('invite').classList.remove('hidden'); $('invwho').textContent=inv.who; } else $('invite').classList.add('hidden');
 const se=me.social_event;
 if(se&&se.seq&&se.seq!==lastSocial){ lastSocial=se.seq; toast(se.type==='codrink'?'🍻 Вы чокнулись кружками!':se.type==='hunt'?'🦌 Добыча! мясо в закромах':'🍻 Тост за здоровье!'); }
}
</script>
</body>
</html>
