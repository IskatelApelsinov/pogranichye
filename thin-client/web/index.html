<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b21">
<title>Приграничье</title>
<style>
 :root{--bg:#24251f;--card:#39352b;--line:#66533c;--ink:#f1e5c9;--sub:#c2b18e;
   --gold:#e8bd66;--good:#8da96a;--warn:#d99b4e;--bad:#c96b58;--accent:#9b6541}
 *{box-sizing:border-box} html,body{overflow-x:hidden}
 body{background:radial-gradient(ellipse at 50% 0%,#4a4934 0,#24251f 62%);color:var(--ink);font:16px/1.5 Georgia,serif;
   max-width:680px;margin:0 auto;padding:16px}
 h1{font-size:25px;margin:.2em 0;color:#f2d9a7;text-shadow:0 2px #39291e} .sub{color:var(--sub);font-size:13px}
 .card{background:linear-gradient(145deg,#454032,#332f27);border:1px solid var(--line);border-radius:9px;padding:16px;margin:12px 0;box-shadow:0 5px 14px #1117}
 .village-art{padding:5px;overflow:hidden;background:#4a4635;border-color:#9b7951}
 .village-art img{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid #7b6242;border-radius:4px}
 .scene-caption{display:flex;justify-content:space-between;gap:8px;padding:5px 7px 1px;color:#e7d3a7;font-size:12px}
 .scene-caption span:last-child{color:#c5b18b}
 input{width:100%;background:#26251f;color:var(--ink);border:1px solid var(--line);
   border-radius:10px;padding:12px;font:inherit;margin:6px 0;min-height:46px}
 button{background:linear-gradient(#67533b,#493a2b);color:var(--ink);border:1px solid #8b704b;border-radius:7px;
   padding:12px 14px;font:inherit;cursor:pointer;min-height:46px;touch-action:manipulation}
 button.primary{background:linear-gradient(#b77b4e,#865334);border-color:#d3a06a;color:#fff4dc;width:100%}
 button:active{filter:brightness(1.2)}
 .row{display:flex;gap:8px;flex-wrap:wrap}
 .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
 .bar{height:10px;border-radius:3px;background:#211f1a;border:1px solid #5c4a35;overflow:hidden;margin:3px 0 10px}
 .bar>div{height:100%}
 .stat{font-size:13px;color:var(--sub)}
 .big{font-size:20px;font-weight:700}
 .tag{font-size:12px;padding:2px 9px;border-radius:4px;background:#514431;color:#ead4a7;border:1px solid #786143}
 .nb{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
 .nb:last-child{border:0}
 #err{color:var(--bad);font-size:13px;min-height:18px}
 .hidden{display:none}
 .gold{color:var(--gold)}
</style>
</head>
<body>
<h1>Приграничье <span class="sub" id="ver">· живой мир</span></h1>

<!-- вход / регистрация -->
<div class="card" id="auth">
 <div class="row" style="margin-bottom:8px">
  <button id="tabLogin" class="primary" style="width:auto;flex:1">Вход</button>
  <button id="tabReg" style="flex:1">Регистрация</button>
 </div>
 <input id="login" placeholder="логин" autocomplete="username">
 <input id="pass" type="password" placeholder="пароль (от 4 символов)" autocomplete="current-password">
 <button class="primary" id="go">Войти в мир</button>
 <div id="err"></div>
 <div class="sub" style="margin-top:8px">Регистрация отдельна от мира: один аккаунт — любой клиент.
  Войдя, ты вселяешься в жителя Приграничья и живёшь его жизнью.</div>
</div>

<!-- игра -->
<div id="game" class="hidden">
 <div class="card village-art">
  <div class="scene-wrap" style="position:relative">
   <img id="sceneimg" src="village-scene.svg" alt="Карта деревни: таверна, кузница, рынок, огород и река">
   <canvas id="scene" style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas>
  </div>
  <div class="scene-caption"><span id="scenehint">ПОСЕЛЕНИЕ · ЖИВАЯ ПЛОЩАДКА</span><span class="sub">WASD/стрелки — ходить · точка — ты</span></div>
 </div>
 <div class="card">
  <div class="row" style="justify-content:space-between;align-items:center">
   <div><span class="big" id="who">—</span> <span class="sub" id="role"></span></div>
   <span class="tag" id="when">—</span>
  </div>
  <div class="stat">здоровье <span id="hv"></span></div><div class="bar"><div id="hbar"></div></div>
  <div class="stat">сытость <span id="fv"></span></div><div class="bar"><div id="fbar"></div></div>
  <div class="stat">силы <span id="ev"></span></div><div class="bar"><div id="ebar"></div></div>
  <div class="stat">настрой <span id="mv"></span></div><div class="bar"><div id="mbar"></div></div>
  <div class="sub" id="last" style="margin-top:6px"></div>
  <div style="margin-top:6px" id="purse">💰 <span class="gold" id="coins">0</span> монет <span class="sub" id="debt"></span></div>
  <div class="sub" id="wounds" style="margin-top:6px"></div>
  <div class="sub" id="stash" style="margin-top:4px"></div>
 </div>

 <div class="card">
  <div><b id="place">—</b> <span class="tag" id="tier"></span></div>
  <div class="sub" id="placefood" style="margin:4px 0 8px"></div>
  <b class="sub">чем займёшься</b>
  <div class="acts">
   <button onclick="goal('work')">⚒ Работать</button>
   <button onclick="goal('eat')">🍞 Поесть</button>
   <button onclick="goal('rest')">💤 Отдохнуть</button>
   <button onclick="goal('socialize')">🍯 В таверну</button>
  </div>
  <div id="tavernbox" style="margin-top:10px">
   <b class="sub">корчма <span class="sub" id="beerinfo"></span></b>
   <div class="acts">
    <button id="buybtn" onclick="buyBeer()">🍺 Заказать кружку</button>
    <button id="drinkbtn" onclick="drinkBeer()">🍻 Выпить</button>
   </div>
   <div class="sub" id="tavernmsg" style="margin-top:4px"></div>
  </div>
 </div>

 <div class="card">
  <b class="sub">рядом живут</b>
  <div id="neighbors"></div>
 </div>
 <button id="leave" style="width:100%;margin-bottom:24px">Выйти (тело вернётся под управление мира)</button>
</div>

<script>
let token=null, ws=null, mode='login';
const $=id=>document.getElementById(id);
$('tabLogin').onclick=()=>{mode='login';$('tabLogin').className='primary';$('tabReg').className='';$('go').textContent='Войти в мир';};
$('tabReg').onclick =()=>{mode='reg';  $('tabReg').className='primary';$('tabLogin').className='';$('go').textContent='Создать и войти';};

async function api(path,body){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 return r.json();
}
$('go').onclick=async()=>{
 $('err').textContent='';
 const login=$('login').value.trim(), pass=$('pass').value;
 if(!login||pass.length<4){$('err').textContent='нужен логин и пароль от 4 символов';return;}
 if(mode==='reg'){
   const rr=await api('/api/register',{login,pass});
   if(!rr.ok){$('err').textContent=rr.msg||'не удалось зарегистрироваться';return;}
 }
 const lr=await api('/api/login',{login,pass});
 if(!lr.ok){$('err').textContent=lr.msg||'неверный вход';return;}
 token=lr.token; connect();
};

function connect(){
 const proto=location.protocol==='https:'?'wss':'ws';
 ws=new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
 ws.onmessage=e=>render(JSON.parse(e.data));
 ws.onclose=()=>{ if(token){ $('err').textContent='связь прервалась'; } };
 ws.onopen=()=>{ $('auth').classList.add('hidden'); $('game').classList.remove('hidden'); };
}
function goal(g){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({op:'goal',goal:g})); }
$('leave').onclick=()=>{ token=null; if(ws)ws.close(); location.reload(); };

// --- ходьба: клавиши задают направление, шлём op:"move" с растущим seq и реальным dt ---
const keys={}, SCENE_R=30;
let seq=0, lastMove=performance.now();
addEventListener('keydown',e=>{ keys.Shift=e.shiftKey; if(mapKey(e.key)){keys[mapKey(e.key)]=1; e.preventDefault();} });
addEventListener('keyup',  e=>{ keys.Shift=e.shiftKey; if(mapKey(e.key)) keys[mapKey(e.key)]=0; });
function mapKey(k){ k=k.toLowerCase();
 return ({w:'N',arrowup:'N',s:'S',arrowdown:'S',a:'W',arrowleft:'W',d:'E',arrowright:'E'})[k]||''; }
setInterval(()=>{
 if(!ws||ws.readyState!==1) return;
 const now=performance.now(), dt=Math.min(0.25,(now-lastMove)/1000); lastMove=now;
 let mx=(keys.E?1:0)-(keys.W?1:0), my=(keys.N?1:0)-(keys.S?1:0);
 if(mx===0&&my===0) return; // стоим — не шлём
 const face=Math.atan2(my,mx)*180/Math.PI;
 ws.send(JSON.stringify({v:1,op:'move',mx,my,run:keys.Shift?true:false,face,dt,seq:++seq}));
},100);

// --- пиво: buy/consume, reqid для идемпотентности; исход увидим в кадре (me.mug) ---
function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function buyBeer(){ if(ws&&ws.readyState===1){ ws.send(JSON.stringify({op:'buy',item:'beer',reqid:rid()})); tmsg('заказываю…'); } }
function drinkBeer(){ if(ws&&ws.readyState===1){ ws.send(JSON.stringify({op:'consume',item:'beer',reqid:rid()})); tmsg('пью…'); } }
function tmsg(t){ $('tavernmsg').textContent=t; }

// --- живая карта: рисуем игрока и соседей по их координатам сцены (они двигаются сервером) ---
const roleColor={farmer:'#9bd36a',smith:'#d98b4e',fisher:'#6ab0d9',hunter:'#c7703a',cook:'#d9c24e',
 tavernkeeper:'#d36ad0',herbalist:'#6ad9a3',weaver:'#b0a0d9',miner:'#b0b0b0',herder:'#c9d96a',woodcutter:'#8a9b5a'};
function drawScene(s){
 const cv=$('scene'), img=$('sceneimg'); if(!cv||!img.clientWidth) return;
 const W=img.clientWidth, H=img.clientHeight; cv.width=W; cv.height=H;
 const g=cv.getContext('2d'); g.clearRect(0,0,W,H);
 const cx=W/2, cy=H/2, sc=Math.min(W,H)/2/SCENE_R*0.92;
 const toPx=(x,y)=>[cx+x*sc, cy-y*sc]; // +Y на север (вверх)
 const dot=(x,y,r,col,ring)=>{ const[px,py]=toPx(x,y); g.beginPath(); g.arc(px,py,r,0,7); g.fillStyle=col; g.fill();
   if(ring){ g.lineWidth=2; g.strokeStyle=ring; g.stroke(); } return[px,py]; };
 (s.place&&s.place.neighbors||[]).forEach(n=>{
   if(!n.pos) return;
   const[px,py]=dot(n.pos.x,n.pos.y,4,roleColor[n.role]||'#caa',null);
   g.fillStyle='#ead9b0'; g.font='10px Georgia'; g.textAlign='center';
   g.fillText(n.name||'', px, py-7);
 });
 if(s.me&&s.me.pos){ const[px,py]=dot(s.me.pos.x,s.me.pos.y,6,'#ffe9a8','#8a5a2b');
   g.fillStyle='#fff4dc'; g.font='bold 11px Georgia'; g.textAlign='center'; g.fillText('ты',px,py-9); }
}

function barColor(v){ return v<25?'var(--bad)':v<55?'var(--warn)':'var(--good)'; }
function setBar(id,val,invert){
 const shown=invert?100-val:val;
 $(id+'bar').style.width=Math.max(0,Math.min(100,shown))+'%';
 $(id+'bar').style.background=barColor(invert?100-val:val);
 $(id+'v').textContent=Math.round(val);
}
function render(s){
 if(!s.alive){ $('who').textContent='твоё тело покинуло мир'; return; }
 const me=s.me;
 $('who').textContent=me.name+(me.surname?' '+me.surname:'');
 $('role').textContent='· '+me.role+' · '+me.age+' лет';
 $('when').textContent=`год ${s.year}, ${s.season}, день ${s.day}`;
 setBar('h',me.health); setBar('f',100-me.hunger); // сытость = 100-голод
 $('fv').textContent=Math.round(100-me.hunger);
 setBar('e',me.energy); setBar('m',me.morale);
 const goalNames={work:'работает',eat:'ест',rest:'отдыхает',socialize:'в таверне',seek_home:'ищет дом',leave:'в пути',wander:'бродит'};
 $('last').innerHTML='сейчас: <span class="gold">'+(goalNames[me.goal]||me.goal||'—')+'</span> · '+(me.last||'');
 $('coins').textContent=me.coins;
 $('debt').textContent=(me.debt>0)?('· 🧾 долг '+me.debt):'';
 const parts={head:'голова',torso:'торс',arm:'рука',leg:'нога'};
 const w=me.wounds||{}; const ws=Object.keys(w);
 if(ws.length||me.bleeding>0){
   let t='🩹 раны: '+ws.map(p=>(parts[p]||p)+' '+w[p]).join(', ');
   if(me.bleeding>0) t+=(ws.length?' · ':'раны: ')+'🩸 кровит '+me.bleeding;
   $('wounds').textContent=t;
 } else { $('wounds').textContent=''; }
 const goods={wheat:'зерно',bread:'хлеб',fish:'рыба',meat:'мясо',milk:'молоко',veg:'овощи',cheese:'сыр',egg:'яйца',game:'дичь'};
 const stash=me.stash||{}; const sk=Object.keys(stash);
 $('stash').textContent = sk.length ? ('🧺 в закромах: '+sk.map(g=>(goods[g]||g)+' '+stash[g]).join(', ')) : '';
 if(s.place){
   $('place').textContent=s.place.name;
   $('tier').textContent={village:'деревня',town:'городок',city:'город'}[s.place.tier]||s.place.tier;
   $('placefood').textContent=`на рынке: еды ${s.place.food}, хлеба ${s.place.bread} (цена ${s.place.bread_price}⌾)`;
   $('neighbors').innerHTML=(s.place.neighbors||[]).map(n=>
     `<div class="nb">${n.name} <span class="sub">— ${n.role}, ${n.act}</span></div>`).join('')||'<div class="sub">никого рядом</div>';
   // корчма: показываем запас/цену, кнопки по состоянию кружки и наличию пива
   const hasTavern=s.place.tavern, beer=s.place.beer||0, price=s.place.beer_price, mug=!!me.mug;
   $('tavernbox').style.display=hasTavern?'':'none';
   if(hasTavern){
     $('beerinfo').textContent=`· пива ${beer} · кружка ${price}⌾`+(mug?' · 🍺 у тебя кружка':'');
     $('buybtn').disabled = mug || beer<1 || me.coins<price;
     $('drinkbtn').disabled = !mug;
     if(mug) tmsg('кружка в руке — можно выпить');
     else if(beer<1) tmsg('пиво кончилось');
   }
 }
 drawScene(s);
}
</script>
</body>
</html>
