<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Деревня Пограничье</title><desc id="desc">Пиксельная карта деревни: таверна, кузница, рынок, огород, река, мост и жители.</desc>
