 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#6ca4a0"/><stop offset="1" stop-color="#386d78"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#263323" flood-opacity=".35"/></filter>
