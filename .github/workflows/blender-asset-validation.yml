name: Blender asset generation and validation

on:
  pull_request:
    paths:
      - "2-client/art-source/blender/**"
      - ".github/workflows/blender-asset-validation.yml"
  push:
    paths:
      - "2-client/art-source/blender/**"
      - ".github/workflows/blender-asset-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Blender 4.2.0
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.2.0
          key: blender-4.2.0-linux-x64

      - name: Install Blender 4.2.0
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz \
            --output /tmp/blender-4.2.0-linux-x64.tar.xz
          mkdir -p /opt/blender-4.2.0
          tar -xJf /tmp/blender-4.2.0-linux-x64.tar.xz \
            --directory /opt/blender-4.2.0 --strip-components=1
          rm /tmp/blender-4.2.0-linux-x64.tar.xz

      - name: Add Blender to PATH
        run: echo "/opt/blender-4.2.0" >> "$GITHUB_PATH"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libice6

      - name: Verify Blender version
        run: blender --background --factory-startup --python-expr "import bpy; assert bpy.app.version >= (4, 2, 0); print(bpy.app.version_string)"

      - name: Generate original tavern props
        working-directory: 2-client/art-source/blender
        run: blender --background --factory-startup --python-exit-code 1 --python generate_tavern_props.py

      - name: Validate generated scene, meshes, textures and exports
        working-directory: 2-client/art-source/blender
        run: blender --background --python-exit-code 1 --python validate_tavern_props.py

      - name: Upload generated Blender assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pogranichye-tavern-props-blender-4.2.0
          path: 2-client/art-source/blender/generated/
          if-no-files-found: warn
          retention-days: 14

  publish-generated-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: blender-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download validated Blender assets
        uses: actions/download-artifact@v4
        with:
          name: pogranichye-tavern-props-blender-4.2.0
          path: 2-client/art-source/blender/generated

      - name: Prepare reviewed Unity asset pull request
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir="2-client/art-source/blender/generated"
          destination="2-client/game/Assets/Resources/TavernProps"

          for asset in tankard_oakbeer barrel_oak basket_wickermarket bench_rustic; do
            test -s "$source_dir/$asset.fbx"
          done
          test -s "$source_dir/asset_manifest.json"
          test -s "$source_dir/textures/oak_grain.png"
          test -s "$source_dir/textures/wicker_reed.png"
          test -s "$source_dir/textures/bread_crust.png"

          mkdir -p "$destination/Textures"
          cp "$source_dir"/*.fbx "$destination/"
          cp "$source_dir"/textures/*.png "$destination/Textures/"
          cp "$source_dir/asset_manifest.json" "$destination/"

          branch="generated/tavern-props-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          git switch --create "$branch"
          git add "$destination"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: install validated tavern props into Unity Resources"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request for generated Unity assets
        if: steps.assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "${{ steps.assets.outputs.branch }}" \
            --title "Assets: install validated tavern props in Unity Resources" \
            --body "Generated by the pinned Blender 4.2.0 validation workflow. Please review the binary FBX files, textures, manifest and Unity import before merging. The workflow never commits generated assets directly to main."
