jobs:
  pure-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono compiler and Newtonsoft.Json
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-mcs unzip
          mkdir -p "$RUNNER_TEMP/newtonsoft"
          curl -fsSL https://api.nuget.org/v3-flatcontainer/newtonsoft.json/13.0.3/newtonsoft.json.13.0.3.nupkg -o "$RUNNER_TEMP/newtonsoft/newtonsoft.json.nupkg"
          unzip -q "$RUNNER_TEMP/newtonsoft/newtonsoft.json.nupkg" -d "$RUNNER_TEMP/newtonsoft"
          test -f "$RUNNER_TEMP/newtonsoft/lib/net45/Newtonsoft.Json.dll"
          echo "MONO_PATH=$RUNNER_TEMP/newtonsoft/lib/net45" >> "$GITHUB_ENV"
      - name: Server-authoritative shop catalogue source checks
        working-directory: 2-client/game
        run: python3 -m unittest discover -s Tests -p 'test_shop_catalog_source.py'

      - name: Localization catalog regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/localization-catalog.exe Tests/LocalizationCatalogCheck.cs Assets/_Project/Scripts/Presentation/LocalizationCatalog.cs
          mono /tmp/localization-catalog.exe
      - name: RequestGate regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/request-gate.exe Tests/RequestGateCheck.cs Assets/_Project/Scripts/Runtime/RequestGate.cs
          mono /tmp/request-gate.exe
      - name: Movement queue regression checks
