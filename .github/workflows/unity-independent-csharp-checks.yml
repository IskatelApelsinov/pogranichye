name: Unity-independent C# checks

on:
  pull_request:
    paths:
      - '.github/workflows/unity-independent-csharp-checks.yml'
      - '2-client/game/Assets/_Project/Editor/ProtocolFixtureValidator.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/FastFrameParser.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/ActionResultFrame.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/ActionResultFrameParser.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/CardGameFrames.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/CombatFoeFrames.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/FeedFrameParser.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/HorseStatsFrames.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/JourneyQuestFrames.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/RegionFrames.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/TavernCounterFrame.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/Protocol/WorldFrame.cs'
      - '2-client/game/Assets/_Project/Scripts/Networking/WorldFrameParser.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/BillboardLabel.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/ClientUiTypography.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/DrinkPresentationPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/EntityViewRegistry.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/FoePresentationPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/MapLabelLayoutPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/NpcActivitySoundPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/PoiPositionPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/ProceduralGait.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/ProceduralVillageBuilder.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/SettlementLayoutSelectionPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/SignFaceVisibility.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldInteractionProbe.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldInteractionRaycastMaskPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldLabelVisibilityPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldLayoutPoiInteractionPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldLayoutPoiTargetBuilder.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldLayoutPresentationBuilder.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/WorldPoi.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/CharacterMenuHotkeyPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/ClientInput.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/CoreGameplay.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/GameplayStatusView.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/InputEventDebugState.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/MovementIntentQueuePolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/RequestGate.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/VerticalSliceController.cs'
      - '2-client/game/Assets/_Project/Scripts/World/HexCellCoordinate.cs'
      - '2-client/game/Assets/_Project/Scripts/World/HexCellStreamingPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/World/WorldOriginState.cs'
      - '2-client/game/Assets/_Project/Scripts/World/WorldChunkStreamingPolicy.cs'
      - '2-client/game/Tests/WorldOriginStateCheck.cs'
      - '2-client/game/Tests/WorldChunkStreamingPolicyCheck.cs'
      - '2-client/game/Tests/ActionResultFrameParserCheck.cs'
      - '2-client/game/Tests/CardGameFrameParserCheck.cs'
      - '2-client/game/Tests/CharacterMenuHotkeyPolicyCheck.cs'
      - '2-client/game/Tests/CombatFoeFrameParserCheck.cs'
      - '2-client/game/Tests/DrinkPresentationPolicyCheck.cs'
      - '2-client/game/Tests/FeedFrameParserCheck.cs'
      - '2-client/game/Tests/FoePresentationPolicyCheck.cs'
      - '2-client/game/Tests/GameplayStatusViewCheck.cs'
      - '2-client/game/Tests/HexCellCoordinateCheck.cs'
      - '2-client/game/Tests/HexCellStreamingPolicyCheck.cs'
      - '2-client/game/Tests/InputEventDebugStateCheck.cs'
      - '2-client/game/Tests/JourneyQuestFrameParserCheck.cs'
      - '2-client/game/Tests/MapLabelLayoutPolicyCheck.cs'
      - '2-client/game/Tests/MovementIntentQueuePolicyCheck.cs'
      - '2-client/game/Tests/NpcActivitySoundPolicyCheck.cs'
      - '2-client/game/Tests/PoiPositionPolicyCheck.cs'
      - '2-client/game/Tests/RegionFrameParserCheck.cs'
      - '2-client/game/Tests/RequestGateCheck.cs'
      - '2-client/game/Tests/SettlementLayoutSelectionPolicyCheck.cs'
      - '2-client/game/Tests/TavernCounterFrameParserCheck.cs'
      - '2-client/game/Tests/WorldLabelVisibilityPolicyCheck.cs'
      - '2-client/game/Tests/WorldLayoutPoiInteractionPolicyCheck.cs'
      - '2-client/game/Tests/WorldInteractionRaycastMaskPolicyCheck.cs'
jobs:
  pure-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-mcs libnewtonsoft-json-cil-dev
      - name: RequestGate regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/request-gate.exe Tests/RequestGateCheck.cs Assets/_Project/Scripts/Runtime/RequestGate.cs
          mono /tmp/request-gate.exe
      - name: Movement queue regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/movement-queue.exe Tests/MovementIntentQueuePolicyCheck.cs Assets/_Project/Scripts/Runtime/MovementIntentQueuePolicy.cs
          mono /tmp/movement-queue.exe
      - name: Input event diagnostics regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/input-event-debug.exe Tests/InputEventDebugStateCheck.cs Assets/_Project/Scripts/Runtime/InputEventDebugState.cs
          mono /tmp/input-event-debug.exe
      - name: Character menu hotkey regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/character-menu-hotkeys.exe Tests/CharacterMenuHotkeyPolicyCheck.cs Assets/_Project/Scripts/Runtime/CharacterMenuHotkeyPolicy.cs
          mono /tmp/character-menu-hotkeys.exe
      - name: NPC activity sound mapping regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/npc-activity-sound.exe Tests/NpcActivitySoundPolicyCheck.cs Assets/_Project/Scripts/Presentation/NpcActivitySoundPolicy.cs
          mono /tmp/npc-activity-sound.exe
      - name: Drink presentation event regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/drink-presentation.exe Tests/DrinkPresentationPolicyCheck.cs Assets/_Project/Scripts/Presentation/DrinkPresentationPolicy.cs
          mono /tmp/drink-presentation.exe
      - name: Settlement layout selection regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/settlement-layout-selection.exe Tests/SettlementLayoutSelectionPolicyCheck.cs Assets/_Project/Scripts/Presentation/SettlementLayoutSelectionPolicy.cs
          mono /tmp/settlement-layout-selection.exe
      - name: Hex cell coordinate regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/hex-cell-coordinate.exe Tests/HexCellCoordinateCheck.cs Assets/_Project/Scripts/World/HexCellCoordinate.cs
          mono /tmp/hex-cell-coordinate.exe
      - name: Layout POI position regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/poi-position.exe Tests/PoiPositionPolicyCheck.cs Assets/_Project/Scripts/Presentation/PoiPositionPolicy.cs
          mono /tmp/poi-position.exe
      - name: Hex cell streaming policy regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/hex-cell-streaming-policy.exe Tests/HexCellStreamingPolicyCheck.cs Assets/_Project/Scripts/World/HexCellCoordinate.cs Assets/_Project/Scripts/World/HexCellStreamingPolicy.cs
          mono /tmp/hex-cell-streaming-policy.exe
      - name: Floating origin precision and rebase regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/world-origin-state.exe Tests/WorldOriginStateCheck.cs Assets/_Project/Scripts/World/WorldOriginState.cs
          mono /tmp/world-origin-state.exe
      - name: Square world chunk streaming regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/world-chunk-streaming.exe Tests/WorldChunkStreamingPolicyCheck.cs Assets/_Project/Scripts/World/WorldChunkStreamingPolicy.cs
          mono /tmp/world-chunk-streaming.exe
      - name: Foe presentation policy regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/foe-presentation.exe Tests/FoePresentationPolicyCheck.cs Assets/_Project/Scripts/Presentation/FoePresentationPolicy.cs
          mono /tmp/foe-presentation.exe
      - name: World label visibility policy regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/world-label-visibility.exe Tests/WorldLabelVisibilityPolicyCheck.cs Assets/_Project/Scripts/Presentation/WorldLabelVisibilityPolicy.cs
          mono /tmp/world-label-visibility.exe
      - name: Settlement map label layout regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/map-label-layout.exe Tests/MapLabelLayoutPolicyCheck.cs Assets/_Project/Scripts/Presentation/MapLabelLayoutPolicy.cs
          mono /tmp/map-label-layout.exe

      - name: Typed gameplay status view regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/gameplay-status-view.exe Tests/GameplayStatusViewCheck.cs Assets/_Project/Scripts/Runtime/GameplayStatusView.cs
          mono /tmp/gameplay-status-view.exe
      - name: Typed feed frame parser regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/feed-frame-parser.exe Tests/FeedFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/FeedFrameParser.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrame.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrameParser.cs Assets/_Project/Scripts/Networking/Protocol/CombatFoeFrames.cs Assets/_Project/Scripts/Networking/FastFrameParser.cs Assets/_Project/Scripts/Runtime/GameplayStatusView.cs
          mono /tmp/feed-frame-parser.exe
      - name: Typed action result parser regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/action-result-parser.exe Tests/ActionResultFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrame.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrameParser.cs Assets/_Project/Scripts/Networking/Protocol/CombatFoeFrames.cs Assets/_Project/Scripts/Networking/Protocol/FeedFrameParser.cs Assets/_Project/Scripts/Networking/FastFrameParser.cs Assets/_Project/Scripts/Runtime/GameplayStatusView.cs
          mono /tmp/action-result-parser.exe
      - name: Typed combat and foe frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/combat-foe-frame.exe Tests/CombatFoeFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/CombatFoeFrames.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrame.cs Assets/_Project/Scripts/Networking/Protocol/ActionResultFrameParser.cs Assets/_Project/Scripts/Networking/Protocol/FeedFrameParser.cs Assets/_Project/Scripts/Networking/FastFrameParser.cs Assets/_Project/Scripts/Runtime/GameplayStatusView.cs
          mono /tmp/combat-foe-frame.exe
      - name: Typed journey and quest frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/journey-quest-frame.exe Tests/JourneyQuestFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/JourneyQuestFrames.cs
          mono /tmp/journey-quest-frame.exe
      - name: Typed horse, stats and carried bag frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/horse-stats-frame.exe Tests/HorseStatsFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/HorseStatsFrames.cs
          mono /tmp/horse-stats-frame.exe
      - name: Typed card game frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/card-game-frame.exe Tests/CardGameFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/CardGameFrames.cs
          mono /tmp/card-game-frame.exe
      - name: Typed regional map frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/region-frame.exe Tests/RegionFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/RegionFrames.cs
          mono /tmp/region-frame.exe
      - name: Typed tavern counter frame regression checks
        working-directory: 2-client/game
        run: |
          NEWTONSOFT="$(find /usr/lib -name 'Newtonsoft.Json.dll' -print -quit)"
          test -n "$NEWTONSOFT"
          mcs -r:"$NEWTONSOFT" -out:/tmp/tavern-counter-frame.exe Tests/TavernCounterFrameParserCheck.cs Assets/_Project/Scripts/Networking/Protocol/TavernCounterFrame.cs
          mono /tmp/tavern-counter-frame.exe
      - name: Generated layout POI interaction allow-list checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/layout-poi-interactions.exe Tests/WorldLayoutPoiInteractionPolicyCheck.cs Assets/_Project/Scripts/Presentation/WorldLayoutPoiInteractionPolicy.cs
          mono /tmp/layout-poi-interactions.exe

      - name: World interaction raycast mask regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/world-interaction-raycast-mask.exe Tests/WorldInteractionRaycastMaskPolicyCheck.cs Assets/_Project/Scripts/Presentation/WorldInteractionRaycastMaskPolicy.cs
          mono /tmp/world-interaction-raycast-mask.exe

      - name: Initial full-frame socket ownership regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/initial-full-frame-buffer.exe Tests/InitialFullFrameBufferCheck.cs Assets/_Project/Scripts/Runtime/InitialFullFrameBuffer.cs
          mono /tmp/initial-full-frame-buffer.exe


