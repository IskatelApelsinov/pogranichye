name: Unity-independent C# checks

on:
  pull_request:
    paths:
      - '2-client/game/Assets/_Project/Scripts/Runtime/RequestGate.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/MovementIntentQueuePolicy.cs'
      - '2-client/game/Tests/RequestGateCheck.cs'
      - '2-client/game/Tests/MovementIntentQueuePolicyCheck.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/ClientInput.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/InputEventDebugState.cs'
      - '2-client/game/Assets/_Project/Scripts/Runtime/VerticalSliceController.cs'
      - '2-client/game/Tests/InputEventDebugStateCheck.cs'
      - '2-client/game/Assets/_Project/Scripts/Presentation/NpcActivitySoundPolicy.cs'
      - '2-client/game/Assets/_Project/Scripts/World/HexCellCoordinate.cs'
      - '2-client/game/Tests/HexCellCoordinateCheck.cs'
      - '2-client/game/Assets/_Project/Scripts/World/HexCellStreamingPolicy.cs'
      - '2-client/game/Tests/HexCellStreamingPolicyCheck.cs'
      - '2-client/game/Tests/NpcActivitySoundPolicyCheck.cs'
      - '.github/workflows/unity-independent-csharp-checks.yml'

jobs:
  pure-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-mcs
      - name: RequestGate regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/request-gate.exe Tests/RequestGateCheck.cs Assets/_Project/Scripts/Runtime/RequestGate.cs
          mono /tmp/request-gate.exe
      - name: Movement queue regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/movement-queue.exe Tests/MovementIntentQueuePolicyCheck.cs Assets/_Project/Scripts/Runtime/MovementIntentQueuePolicy.cs
          mono /tmp/movement-queue.exe
      - name: Input event diagnostics regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/input-event-debug.exe Tests/InputEventDebugStateCheck.cs Assets/_Project/Scripts/Runtime/InputEventDebugState.cs
          mono /tmp/input-event-debug.exe
      - name: NPC activity sound mapping regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/npc-activity-sound.exe Tests/NpcActivitySoundPolicyCheck.cs Assets/_Project/Scripts/Presentation/NpcActivitySoundPolicy.cs
          mono /tmp/npc-activity-sound.exe
      - name: Hex cell coordinate regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/hex-cell-coordinate.exe Tests/HexCellCoordinateCheck.cs Assets/_Project/Scripts/World/HexCellCoordinate.cs
          mono /tmp/hex-cell-coordinate.exe
      - name: Hex cell streaming policy regression checks
        working-directory: 2-client/game
        run: |
          mcs -out:/tmp/hex-cell-streaming-policy.exe Tests/HexCellStreamingPolicyCheck.cs Assets/_Project/Scripts/World/HexCellCoordinate.cs Assets/_Project/Scripts/World/HexCellStreamingPolicy.cs
          mono /tmp/hex-cell-streaming-policy.exe
